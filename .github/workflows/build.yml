name: Build

# Builds the app for each platform on every push. The installers are
# attached to the run as downloadable artifacts. The in-app updater fetches
# the small per-platform artifacts (one zip for a Mac of its chip, the
# Windows installer, the AppImage); the rest are for installing by hand.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pacman packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm test
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Mac: the updater takes the zip for its chip; the disk images are for a first install.
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'mac'
        with:
          name: cubecrusher-mac-arm64
          path: release/*-arm64-mac.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'mac'
        with:
          name: cubecrusher-mac-x64
          path: release/*-x64-mac.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'mac'
        with:
          name: cubecrusher-mac
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'win'
        with:
          name: cubecrusher-win
          path: release/*.exe
          if-no-files-found: error

      # Linux: the updater replaces the AppImage; the pacman package is separate.
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: cubecrusher-linux
          path: release/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: cubecrusher-linux-pacman
          path: release/*.pacman
          if-no-files-found: error
