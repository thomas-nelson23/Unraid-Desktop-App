name: Build

# Builds the app for each platform on every push. The installers are
# attached to the run as downloadable artifacts, which the in-app updater
# fetches: one zip for an Apple Silicon Mac, the Windows installer, the
# AppImage, plus the pacman package for CachyOS.
#
# The repository is private, so artifacts count against GitHub's storage
# quota (500 MB on the free plan). Every push therefore replaces the
# previous push's artifacts on the same branch, keeps them a week, and
# skips the big disk images and the Intel Mac zip unless asked for.
on:
  push:
  workflow_dispatch:
    inputs:
      full:
        description: Also build the Mac disk images and the Intel Mac zip
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pacman packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm test
      - name: Build (Apple Silicon zip only, unless a full build was asked for)
        if: matrix.target == 'mac' && !inputs.full
        run: npm run build && npx electron-builder --mac zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build
        if: matrix.target != 'mac' || inputs.full
        run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Make room: drop this platform's artifacts from earlier runs on the same branch.
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.GITHUB_REF_NAME;
            const prefix = 'cubecrusher-${{ matrix.target }}';
            const { data } = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            for (const a of data.artifacts) {
              if (a.expired || a.workflow_run?.id === context.runId) continue;
              if (!a.name.startsWith(prefix) || a.workflow_run?.head_branch !== branch) continue;
              await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
              core.info(`Deleted ${a.name} from run ${a.workflow_run.id} (${Math.round(a.size_in_bytes / 1e6)} MB)`);
            }

      # Mac: the updater takes the zip for its chip; the disk images are for a first install.
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'mac'
        with:
          name: cubecrusher-mac-arm64
          path: release/*-arm64-mac.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'mac' && inputs.full
        with:
          name: cubecrusher-mac-x64
          path: release/*-x64-mac.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'mac' && inputs.full
        with:
          name: cubecrusher-mac
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'win'
        with:
          name: cubecrusher-win
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

      # Linux: the updater replaces the AppImage; the pacman package is for CachyOS.
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: cubecrusher-linux
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: cubecrusher-linux-pacman
          path: release/*.pacman
          if-no-files-found: error
          retention-days: 7
