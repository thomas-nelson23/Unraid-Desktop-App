name: Build

# Builds the app for each platform on every push and publishes the
# installers as a GitHub Release, which the in-app updater reads: a zip for
# an Apple Silicon Mac, the Windows installer, the AppImage and the pacman
# package for CachyOS. The repository is public, so the app fetches them
# with no token. A push to main is a normal release; any other branch is a
# pre-release, so the app's branch picker can try it. Only the newest few
# releases per branch are kept, and none for a branch that is gone.
on:
  push:
  workflow_dispatch:
    inputs:
      full:
        description: Also build the Mac disk images and the Intel Mac zip
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pacman packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm test
      - name: Build (Apple Silicon zip only, unless a full build was asked for)
        if: matrix.target == 'mac' && !inputs.full
        run: npm run build && npx electron-builder --mac zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build
        if: matrix.target != 'mac' || inputs.full
        run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Handed to the release job below, which is what keeps them. The names
      # are the ones the updater in builds before November 2026 looked for,
      # so an app that old can still update itself to a build from here.
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'mac'
        with:
          name: cubecrusher-mac-arm64
          path: release/*-arm64-mac.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'mac' && inputs.full
        with:
          name: cubecrusher-mac-x64
          path: release/*-x64-mac.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'mac' && inputs.full
        with:
          name: cubecrusher-mac
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'win'
        with:
          name: cubecrusher-win
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: cubecrusher-linux
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: cubecrusher-linux-pacman
          path: release/*.pacman
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="builds/${GITHUB_REF_NAME}/${GITHUB_RUN_NUMBER}"
          title="${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          notes="$(git log -1 --pretty=%B "$GITHUB_SHA")"
          flags=()
          [ "$GITHUB_REF_NAME" = main ] || flags+=(--prerelease)
          ls -la installers
          gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "$title" --notes "$notes" "${flags[@]}"
      # Keeps the newest three builds per branch, and none for a branch that's gone.
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const KEEP = 3;
            const branches = new Set((await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 })).map((b) => b.name));
            const releases = (await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 }))
              .map((r) => ({ r, m: /^builds\/(.+)\/(\d+)$/.exec(r.tag_name) }))
              .filter((x) => x.m)
              .sort((a, b) => Number(b.m[2]) - Number(a.m[2]));
            const seen = {};
            for (const { r, m } of releases) {
              const branch = m[1];
              seen[branch] = (seen[branch] || 0) + 1;
              if (branches.has(branch) && seen[branch] <= KEEP) continue;
              await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${r.tag_name}` }).catch(() => {});
              core.info(`Deleted ${r.tag_name} (${branches.has(branch) ? 'old' : 'branch is gone'})`);
            }
